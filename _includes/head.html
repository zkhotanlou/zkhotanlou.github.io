{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- Resolve the theme before the first paint. main.min.js also calls setTheme(),
     but it runs on DOMContentLoaded at the end of <body>, which made every page
     load flash the light theme at dark-mode visitors. -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem('theme');
      var dark = (stored === 'dark') || (stored !== 'light' &&
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) { document.documentElement.setAttribute('data-theme', 'dark'); }
    } catch (e) { /* localStorage blocked (private browsing); keep the light theme */ }
  })();
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">
